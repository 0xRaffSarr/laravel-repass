name: tests

on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # weekly, catches new Laravel/dependency releases

jobs:
  tests:
    runs-on: ubuntu-latest
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / ${{ matrix.stability }}

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['12', '13']
        stability: [prefer-stable]
        include:
          - php: '8.2'
            laravel: '12'
            stability: prefer-lowest
        exclude:
          - php: '8.2' # Laravel 13 requires PHP 8.3+
            laravel: '13'

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, sqlite3
          coverage: none

      - name: Pin Laravel / Testbench
        run: |
          testbench=$([ "${{ matrix.laravel }}" = "13" ] && echo "^11.0" || echo "^10.0")
          composer require "illuminate/auth:^${{ matrix.laravel }}.0" "illuminate/support:^${{ matrix.laravel }}.0" --no-update
          composer require "orchestra/testbench:$testbench" --dev --no-update

      - name: Install dependencies
        run: composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit
